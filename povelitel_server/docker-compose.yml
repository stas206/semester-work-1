services:
  db:
    image: postgres:16
    container_name: povelitel_db
    environment:
      POSTGRES_DB: povelitel_tokio
      POSTGRES_USER: pt_user
      POSTGRES_PASSWORD: pt_pass
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt_user -d povelitel_tokio"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: povelitel_web
    environment:
      PT_CONNECTION_STRING: "Host=db;Port=5432;Database=povelitel_tokio;Username=pt_user;Password=pt_pass;Include Error Detail=true"
      PT_SERVER_HOST: "0.0.0.0"
      PT_SERVER_PORT: "8888"
    ports:
      - "8888:8888"
    volumes:
      - ./MiniHttpServer/static/assets/images/uploads:/app/static/assets/images/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: