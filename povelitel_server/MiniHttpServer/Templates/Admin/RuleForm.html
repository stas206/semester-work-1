<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${Title}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
$if(IsAdmin)<div class="admin-bar">Вы вошли как администратор · <a href="/admin/index">Админ-панель</a> · <a href="/auth/logout">Выйти</a></div>$endif

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/home/index"><img src="/assets/images/logo.svg" alt="Повелитель Токио"></a>
    <nav class="nav">
      <a href="/home/index">Главная</a>
      <a href="/card/index">Карты</a>
      <a href="/item/index">Предметы</a>
      <a href="/rule/index" class="active">Правила</a>
      <a href="/strategy/index">Стратегии</a>
    </nav>
    <a class="auth-link" href="/auth/logout">Выйти</a>
  </div>
</header>

<main class="container">
  <p style="margin-bottom:12px"><a href="/admin/index" class="button button-light">← В админ-панель</a></p>
  <h1>$if(IsEdit)Редактировать раздел правил$elseНовый раздел правил$endif</h1>
  $raw(ErrorHtml)
  <form class="form-stack admin-form" id="rule-form" action="/admin/saverule" method="post">
    <input type="hidden" name="id" value="${Rule.Id}">
    <label>Заголовок
      <input type="text" name="title" id="rule-title" required maxlength="60" value="${Rule.Title}" placeholder="Например: Подготовка">
    </label>
    <div class="form-row">
      <label>Slug (латиница, цифры, дефис)
        <input type="text" name="slug" id="rule-slug" required maxlength="80" value="${Rule.Slug}" placeholder="naprimer-podgotovka">
      </label>
      <label>Порядок
        <input type="number" name="sort_order" id="rule-sort" min="0" required value="${Rule.SortOrder}">
      </label>
    </div>
    <label>Содержимое (WYSIWYG)</label>
    <div id="editor"></div>
    <input type="hidden" name="content" id="content" value="">
    <script type="text/template" id="initial-content">$raw(Rule.Content)</script>
    <button class="button" type="submit">Сохранить раздел</button>
  </form>
</main>

<footer class="footer">
  Вики по настольной игре Повелитель Токио · 2026
</footer>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
