<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${Title}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
$if(IsAdmin)<div class="admin-bar">Вы вошли как администратор · <a href="/admin/index">Админ-панель</a> · <a href="/auth/logout">Выйти</a></div>$endif

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/home/index"><img src="/assets/images/logo.svg" alt="Повелитель Токио"></a>
    <nav class="nav">
      <a href="/home/index">Главная</a>
      <a href="/card/index">Карты</a>
      <a href="/item/index" class="active">Предметы</a>
      <a href="/rule/index">Правила</a>
      <a href="/strategy/index">Стратегии</a>
    </nav>
    <a class="auth-link" href="/auth/logout">Выйти</a>
  </div>
</header>

<main class="container">
  <p style="margin-bottom:12px"><a href="/admin/index" class="button button-light">← В админ-панель</a></p>
  <h1>$if(IsEdit)Редактировать предмет$elseНовый предмет$endif</h1>
  $raw(ErrorHtml)
  <form class="form-stack admin-form" id="item-form" action="/admin/saveitem" method="post">
    <input type="hidden" name="id" value="${Item.Id}">
    <label>Название
      <input type="text" name="name" id="item-name" required maxlength="60" value="${Item.Name}" placeholder="Например, Кубики">
    </label>
    <label>Категория
      <select name="category" id="item-category" data-selected="${Item.Category}">
        <option value="Кубики">Кубики</option>
        <option value="Поле">Поле</option>
        <option value="Жетоны">Жетоны</option>
        <option value="Планшеты">Планшеты</option>
        <option value="Фигурки">Фигурки</option>
      </select>
    </label>
    <label>Описание <span class="char-count" data-for="item-desc"></span>
      <textarea name="description" id="item-desc" rows="3" maxlength="250" required placeholder="Краткое описание предмета (10–250 символов)">${Item.Description}</textarea>
    </label>
    <label>Количество (0–999)
      <input type="number" name="quantity" id="quantity" min="0" max="999" required value="${Item.Quantity}">
    </label>
    <label>Изображение (выбрать из имеющихся или загрузить новое)</label>
    <select name="image_path" id="item-image-path" data-selected="${Item.ImagePath}">
      <option value="">— не менять —</option>
$foreach(var img in ImageOptions)
      <option value="${img}">${img}</option>
$endfor
    </select>
    <div class="upload">
      <label class="upload-dropzone" for="item-photo">
        <input type="file" id="item-photo" class="upload-input" accept="image/*">
        <div class="upload-placeholder">
          <span class="upload-icon">+</span>
          <span>Перетащите фото сюда или нажмите для выбора</span>
          <small>JPG, PNG, SVG · до 5 МБ</small>
        </div>
        <img class="upload-preview" id="item-preview" alt="Предпросмотр" hidden>
        <input type="hidden" name="image_data" id="item-image-data" value="">
      </label>
    </div>
    <button class="button" type="submit">Сохранить предмет</button>
  </form>
</main>

<footer class="footer">
  Вики по настольной игре Повелитель Токио · ${CurrentYear}
</footer>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
