<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${Title}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Roboto+Slab:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
</head>
<body>
$if(IsAdmin)<div class="admin-bar">Вы вошли как администратор · <a href="/admin/index">Админ-панель</a> · <a href="/auth/logout">Выйти</a></div>$endif

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/home/index"><img src="/assets/images/logo.svg" alt="Повелитель Токио"></a>
    <nav class="nav">
      <a href="/home/index">Главная</a>
      <a href="/card/index">Карты</a>
      <a href="/item/index">Предметы</a>
      <a href="/rule/index">Правила</a>
      <a href="/strategy/index" class="active">Стратегии</a>
    </nav>
    <a class="auth-link" href="/auth/logout">Выйти</a>
  </div>
</header>

<main class="container">
  <p style="margin-bottom:12px"><a href="/admin/index" class="button button-light">← В админ-панель</a></p>
  <h1>$if(IsEdit)Редактировать стратегию$elseНовая стратегия$endif</h1>
  $raw(ErrorHtml)
  <form class="form-stack admin-form" id="strategy-form" action="/admin/savestrategy" method="post">
    <input type="hidden" name="id" value="${Strategy.Id}">
    <label>Заголовок
      <input type="text" name="title" id="strategy-title" required maxlength="60" value="${Strategy.Title}" placeholder="Например: Когда входить в Токио">
    </label>
    <div class="form-row">
      <label>Slug
        <input type="text" name="slug" id="strategy-slug" required maxlength="80" value="${Strategy.Slug}" placeholder="kogda-vhodit-v-tokio">
      </label>
      <label>Категория
        <select name="category" id="strategy-category" data-selected="${Strategy.Category}">
          <option value="Общая">Общая</option>
          <option value="Атака">Атака</option>
          <option value="Защита">Защита</option>
          <option value="Энергия">Энергия</option>
        </select>
      </label>
    </div>
    <label>Содержимое (WYSIWYG)</label>
    <div id="editor"></div>
    <input type="hidden" name="content" id="content" value="">
    <script type="text/template" id="initial-content">$raw(Strategy.Content)</script>
    <button class="button" type="submit">Сохранить стратегию</button>
  </form>
</main>

<footer class="footer">
  Вики по настольной игре Повелитель Токио · 2026
</footer>
<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script src="/assets/js/site.js" defer></script>
</body>
</html>
